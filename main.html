<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Input</title>

  <!-- CSS Link -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <section class="container otp-ipt-container">
    <h2 class="heading" id="verification_heading">Verify Your Account</h2>
    <h3 class="subheading" id="verification_subtext">We emailed you the six digit code to acciojob@gmail.com. Enter the
      code below to confirm your email address.</h3>

    <form class="code-container">
      <input type="text" class="code" id="code-1" pattern="[0-9]{1}" maxlength="1" required>
      <input type="text" class="code" id="code-2" pattern="[0-9]{1}" maxlength="1" required>
      <input type="text" class="code" id="code-3" pattern="[0-9]{1}" maxlength="1" required>
      <input type="text" class="code" id="code-4" pattern="[0-9]{1}" maxlength="1" required>
      <input type="text" class="code" id="code-5" pattern="[0-9]{1}" maxlength="1" required>
      <input type="text" class="code" pattern="[0-9]{1}" id="code-6" maxlength="1" required>
      <!-- <input type="submit" class="code" hidden> -->
    </form>
  </section>

  <script src="./otp.js"></script>
</body>

</html>
